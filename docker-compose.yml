services:
  db:
    image: postgis/postgis:16-3.4
    container_name: namami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-namami}
      POSTGRES_USER: ${POSTGRES_USER:-namami_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-namami_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-namami_user} -d ${POSTGRES_DB:-namami}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: namami-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: namami-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadminpassword}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  brain:
    build:
      context: ./brain
      dockerfile: Dockerfile
    container_name: namami-brain
    restart: unless-stopped
    ports:
      - "${BRAIN_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATA_MODE: ${DATA_MODE:-FIXTURE}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      READY_STRICT: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-namami_user}:${POSTGRES_PASSWORD:-namami_password}@db:5432/${POSTGRES_DB:-namami}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadminpassword}
      MINIO_BUCKET_COG: ${MINIO_BUCKET_COG:-namami-cog-granules}
      FEATURE_INCOIS: ${FEATURE_INCOIS:-false}
      FEATURE_IMD: ${FEATURE_IMD:-false}
      FEATURE_BHOONIDHI: ${FEATURE_BHOONIDHI:-false}
      FEATURE_BHASHINI: ${FEATURE_BHASHINI:-false}
      FEATURE_NAVIC: ${FEATURE_NAVIC:-false}
      FEATURE_MOSDAC: ${FEATURE_MOSDAC:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  edge:
    build:
      context: ./edge
      dockerfile: Dockerfile
    container_name: namami-edge
    restart: unless-stopped
    ports:
      - "${EDGE_PORT:-4000}:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "4000"
      NODE_PORT: "4000"
      BRAIN_SERVICE_URL: http://brain:8000
      DATA_MODE: ${DATA_MODE:-FIXTURE}
      FEATURE_NAVIC: ${FEATURE_NAVIC:-false}
    depends_on:
      brain:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: namami-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_EDGE_URL: http://localhost:4000
      NEXT_PUBLIC_BRAIN_URL: http://localhost:8000
      NEXT_PUBLIC_DATA_MODE: ${DATA_MODE:-FIXTURE}
      EDGE_INTERNAL_URL: http://edge:4000
      BRAIN_INTERNAL_URL: http://brain:8000
    depends_on:
      edge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
