version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: namami-db
    restart: always
    environment:
      POSTGRES_DB: namami
      POSTGRES_USER: namami_user
      POSTGRES_PASSWORD: namami_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namami_user -d namami"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: namami-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: namami-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  brain:
    build:
      context: ./brain
      dockerfile: Dockerfile
    container_name: namami-brain
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://namami_user:namami_password@db:5432/namami
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadminpassword
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  edge:
    build:
      context: ./edge
      dockerfile: Dockerfile
    container_name: namami-edge
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - BRAIN_SERVICE_URL=http://brain:8000
      - NODE_ENV=development
    depends_on:
      - brain

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: namami-web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - edge

volumes:
  postgres_data:
  minio_data:
