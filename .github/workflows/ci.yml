name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  brain:
    name: Brain lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r brain/requirements.txt
      - name: Lint
        run: ruff check brain tests
      - name: Test
        run: pytest tests brain/tests -q

  node:
    name: Edge and web lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test -w @namami/edge && npm run test -w @namami/web
      - name: Build
        run: npm run build

  mobile:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
