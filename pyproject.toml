[project]
name = "namami-brain"
version = "0.1.0"
description = "NAMAMI FastAPI AI, geospatial and data services"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["brain"]
asyncio_mode = "auto"
testpaths = ["tests", "brain/tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["brain", "tests"]
exclude = ["brain/alembic"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
